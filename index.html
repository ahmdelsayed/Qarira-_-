<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Hearts – NICU Parent App</title>
<style>
:root{--bg:#FAF7F3;--blue:#A0C9F5;--pink:#F7AFC4;--peach:#FADBC4;--brown:#6D524D;--mblue:#568BCB;--card:#fff;--line:rgba(109,82,77,.12);--ok:#5E9E78;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#FAF7F3}}
*{box-sizing:border-box;margin:0;font-family:"Nunito","Quicksand","Segoe UI",system-ui,sans-serif}
html,body{height:100%;background:#EFE8E1;color:var(--brown)}
#app{max-width:420px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1{font-size:26px;font-weight:800}h2{font-size:20px;font-weight:800;margin-bottom:12px}h3{font-size:15px;font-weight:800}
p,.sm{font-size:14px;line-height:1.5}.mut{opacity:.75}.sm{font-size:12.5px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(109,82,77,.08)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:var(--blue);color:var(--brown);cursor:pointer}
.btn.alt{background:var(--peach)}
.btn:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--mblue);outline-offset:2px}
input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--brown);margin:4px 0 12px}
label{font-size:13px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--peach)}
.pill.live{background:#DDEFE3;color:#3F7A58}.pill.off{background:#EEE;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:28px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--brown);opacity:.65;cursor:pointer;position:relative}
nav button svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{opacity:1;color:var(--mblue)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:3px;background:var(--blue)}
.badge{position:absolute;top:2px;right:22%;background:var(--pink);color:var(--brown);border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
.video{aspect-ratio:4/3;border-radius:22px;background:linear-gradient(160deg,#cfe3f8,#f1d9de);display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden;position:relative;transition:filter .3s}
.video.night{filter:brightness(.45) saturate(.6)}
.video .inc{font-size:64px;transition:transform .3s}
.tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;margin-bottom:8px;font-size:14px;line-height:1.45}
.bubble.n{background:#fff;border-bottom-left-radius:6px}.bubble.p{background:var(--blue);margin-left:auto;border-bottom-right-radius:6px}
.note{background:var(--peach);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.notif{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.notif.unread{border-left:4px solid var(--pink)}
.chip{display:flex;gap:6px;margin-bottom:12px}.chip button{flex:1;border:0;border-radius:12px;padding:9px;font-weight:800;background:#fff;color:var(--brown);cursor:pointer}.chip button.on{background:var(--blue)}
.sw{width:46px;height:26px;border-radius:99px;background:#ddd;position:relative;border:0;cursor:pointer}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--mblue)}.sw.on::after{left:23px}
.center{text-align:center}.demo{font-size:11px;text-align:center;opacity:.6;margin-top:8px}
.banner{background:var(--pink);padding:8px 14px;font-size:13px;font-weight:700;text-align:center}
.spin{width:26px;height:26px;border:3px solid var(--peach);border-top-color:var(--mblue);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.back{border:0;background:none;color:var(--mblue);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
</style></head><body>
<div id="app"><div id="banner"></div><main id="main"></main><nav id="nav" hidden></nav></div>

const tabs=[['home','Home','home'],['live','Live','cam'],['records','Records','rec'],['chat','Messages','msg'],['notifs','Alerts','bell']];
const $=s=>document.querySelector(s);
function go(s){S.screen=s;S.tab=s;render()}
function unread(){return S.notifs.filter(n=>n.u).length}
function nav(){const n=$('#nav');const show=!['welcome','login'].includes(S.screen);n.hidden=!show;if(!show)return;
n.innerHTML=tabs.map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}"><svg viewBox="0 0 24 24">${ic[i]}</svg>${l}${k==='notifs'&&unread()?`<span class="badge">${unread()}</span>`:''}</button>`).join('')}
const V={
welcome:()=>`<div class="center" style="padding-top:40px"><img src="${LOGO}" alt="Little Hearts logo" style="width:200px;height:auto;border-radius:28px;display:block;margin:0 auto"><h1 style="margin:10px 0">Little Hearts</h1><p class="mut">Stay close to your baby, even from far away.</p>
<div style="font-size:70px;margin:34px 0">👶🏻</div><p style="margin-bottom:22px">Watch over your little one, follow daily updates and talk to the nursing team — all in one calm place.</p><button class="btn" onclick="go('login')">Get started</button><p class="demo">Prototype with sample data for demonstration only</p></div>`,
login:()=>`<img src="${LOGO}" alt="Little Hearts logo" style="width:84px;border-radius:20px;display:block;margin:10px auto 0"><h2 style="margin-top:12px">Log in securely</h2><p class="mut" style="margin-bottom:16px">Use the details given to you by the hospital.</p>
<label>Hospital name</label><input value="Sample Children's Hospital"><label>Baby access code</label><input value="NICU-2048" inputmode="text"><label>Baby's name</label><input value="Baby Layla"><label>Baby's date of birth</label><input type="date" value="2026-10-02">
<button class="btn" onclick="S.loading=1;render();setTimeout(()=>{S.loading=0;go('home')},900)">Log in securely</button>
<div class="note" style="margin-top:14px">🔒 Access is limited to authorized family members. Your baby's information is private and protected.</div>`,
home:()=>`<div class="row" style="margin-bottom:16px"><div class="avatar">👶🏻</div><div class="grow"><p class="sm mut">Good morning, Mama 🌸</p><h1 style="font-size:22px">Baby Layla</h1></div><button class="sm" style="border:0;background:var(--peach);border-radius:12px;padding:8px 10px;font-weight:800;color:var(--brown)" onclick="go('settings')">Profile</button></div>
<div class="card"><span class="pill live"><span class="dot"></span>Stable and resting</span><p class="sm mut" style="margin:8px 0 12px">Last update: today, 9:40 AM</p><button class="btn" onclick="go('live')">▶ Watch live</button></div>
<div class="card"><h3>Latest health update</h3><p style="margin-top:6px">Layla gained 20 g since yesterday and finished her morning feed calmly.</p><p class="sm mut" style="margin-top:6px">Recorded by Nurse Mona</p></div>
<div class="grid"><button class="card" style="border:0;text-align:left;color:inherit;cursor:pointer" onclick="go('records')"><div style="font-size:24px">📋</div><h3>Health records</h3></button><button class="card" style="border:0;text-align:left;color:inherit;cursor:pointer" onclick="go('chat')"><div style="font-size:24px">💬</div><h3>Messages</h3></button></div>
<button class="card" style="border:0;width:100%;text-align:left;color:inherit;cursor:pointer" onclick="go('notifs')"><div class="row"><div style="font-size:24px">🔔</div><h3 class="grow">Notifications</h3>${unread()?`<span class="pill" style="background:var(--pink)">${unread()} new</span>`:''}</div></button>
<div class="card row"><div style="font-size:24px">🕓</div><div><h3>Next visiting time</h3><p class="sm">Today, 4:00 PM</p></div></div>
<p class="center sm mut">You are doing wonderfully. We are here with her. 💛</p>`,
live:()=>{const off=S.offline,p=S.paused;
return `<h2>Live camera</h2>${S.loading?'<div class="spin"></div><p class="center sm">Connecting securely…</p>':''}
<div class="video ${S.night?'night':''}">${off?'<div><div style="font-size:40px">📡</div><h3>Connection lost</h3><p class="sm">Reconnecting. Your baby is being cared for.</p></div>':p?'<div><div style="font-size:40px">🩺</div><h3>Medical examination in progress</h3><p class="sm">Camera temporarily paused. It will resume soon.</p></div>':`<div class="inc" style="transform:scale(${S.zoom})">🛏️</div>`}
<span class="tag">${off?'Offline':p?'Paused':'<span class="dot"></span>Live'}</span></div>
<p class="center" style="margin:10px 0 4px;font-weight:700">${off?'We will reconnect automatically':p?'Please check back in a few minutes':'Your baby is sleeping 😴'}</p>
<p class="center sm mut">🔒 Private stream, only you can see it · Sample view</p>
<div class="grid" style="margin:14px 0 10px"><button class="btn alt" onclick="S.zoom=Math.max(1,S.zoom-.3);render()">− Zoom out</button><button class="btn alt" onclick="S.zoom=Math.min(2,S.zoom+.3);render()">+ Zoom in</button></div>
<button class="btn" onclick="S.night=!S.night;render()">${S.night?'☀️ Turn night mode off':'🌙 Night mode'}</button>
<p class="sm mut" style="margin:16px 0 6px">Demo states</p><div class="chip"><button class="${!p&&!off?'on':''}" onclick="S.paused=0;S.offline=0;render()">Live</button><button class="${p?'on':''}" onclick="S.paused=1;S.offline=0;render()">Paused</button><button class="${off?'on':''}" onclick="S.offline=1;S.paused=0;render()">Offline</button></div>`},
records:()=>{const w=[1820,1850,1880,1900,1920],mx=1950,mn=1800;
const pts=w.map((v,i)=>`${20+i*65},${100-(v-mn)/(mx-mn)*80}`).join(' ');
return `<h2>Daily health record</h2><p class="sm mut" style="margin-bottom:12px">Entered by authorized medical staff · Sample data</p>
<div class="grid">${[['⚖️','Weight','1,920 g','Nurse Mona · 9:30 AM'],['🌡️','Temperature','36.8 °C','Nurse Mona · 9:30 AM'],['🫁','Oxygen (SpO₂)','97%','Dr. Karim · 8:00 AM'],['🍼','Feeding','45 ml','Nurse Sara · 9:00 AM']].map(c=>`<div class="card" style="margin:0"><div>${c[0]}</div><p class="sm mut">${c[1]}</p><h3 style="font-size:19px">${c[2]}</h3><p class="sm mut" style="font-size:11px">${c[3]}</p></div>`).join('')}</div>
<div class="card" style="margin-top:12px"><h3>Weight progress (g)</h3><svg viewBox="0 0 340 120" width="100%" role="img" aria-label="Weight rising from 1820 to 1920 grams"><polyline points="${pts}" fill="none" stroke="#568BCB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(10,0)"/>${w.map((v,i)=>`<circle cx="${30+i*65}" cy="${100-(v-mn)/(mx-mn)*80}" r="5" fill="#A0C9F5"/><text x="${30+i*65}" y="116" font-size="10" text-anchor="middle" fill="#6D524D">${v}</text>`).join('')}</svg></div>
<div class="card"><h3>Medications</h3><p class="sm" style="margin-top:4px">Vitamin D drops · given 8:30 AM · Nurse Sara</p></div>
<div class="card"><h3>Doctor's note</h3><p class="sm" style="margin-top:4px">Layla is feeding well and growing steadily. — Dr. Karim, 8:15 AM</p></div>`},
chat:()=>`<h2>Nurse chat</h2><div class="card row"><div class="avatar" style="width:44px;height:44px;font-size:20px">👩🏻‍⚕️</div><div><h3>Nurse Mona</h3><p class="sm"><span class="dot"></span>Available · 8 AM – 8 PM · replies within 30 min</p></div></div>
<div id="msgs">${S.msgs.map(m=>`<div class="bubble ${m.w}">${m.t}</div>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="mi" placeholder="Write a message" style="margin:0" onkeydown="if(event.key==='Enter')send()"><button class="btn" style="width:auto;padding:13px 18px" onclick="send()">Send</button></div>
<div class="note" style="margin-top:12px">⚠️ This chat is not an emergency service. For urgent concerns, contact hospital staff directly.</div>`,
notifs:()=>{const gs=['Today','Yesterday'];
return `<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0">Notifications</h2>${unread()?`<button class="back" style="margin:0" onclick="S.notifs.forEach(n=>n.u=0);render()">Mark all read</button>`:''}</div>
${S.notifs.length?gs.map(g=>`<p class="sm mut" style="margin:8px 0">${g}</p>`+S.notifs.filter(n=>n.g===g).map(n=>`<div class="card notif ${n.u?'unread':''}" onclick="S.notifs.find(x=>x.id==${n.id}).u=0;render()"><div style="font-size:22px">🔔</div><div><h3>${n.t}</h3><p class="sm">${n.d}</p><p class="sm mut" style="font-size:11px">${n.time}</p></div></div>`).join('')).join(''):'<p class="center mut">No notifications yet.</p>'}
<button class="btn alt" onclick="S.notifs=[];render()">Show empty state</button>`},
settings:()=>`<button class="back" onclick="go('home')">← Back</button><h2>Profile & settings</h2>
<div class="card"><h3>Baby Layla</h3><p class="sm">Born 2 Oct 2026 · Sample Children's Hospital · Access code NICU-2048</p><p class="sm mut" style="margin-top:6px">Authorized: Mother, Father</p></div>
<div class="card">${[['n','Push notifications'],['p','Private mode (hide previews)'],['b','Biometric lock']].map(([k,l])=>`<div class="row" style="padding:8px 0"><p class="grow">${l}</p><button class="sw ${S.set[k]?'on':''}" aria-label="${l}" onclick="S.set['${k}']^=1;render()"></button></div>`).join('')}</div>
<div class="card"><h3>Help and support</h3><p class="sm" style="margin-top:4px">Contact the NICU front desk: ext. 204 (sample)</p></div>
<button class="btn alt" onclick="go('welcome')">Log out securely</button>`};
function send(){const i=$('#mi');if(!i||!i.value.trim())return;S.msgs.push({w:'p',t:i.value.trim().replace(/</g,'&lt;')});render();setTimeout(()=>{S.msgs.push({w:'n',t:'Thank you, I will reply soon. 💛'});render()},900)}
function render(){$('#banner').innerHTML=S.offline&&S.screen!=='live'?'<div class="banner">You are offline</div>':'';
$('#main').innerHTML=V[S.screen]();nav();}
render();
</script></body></html>
