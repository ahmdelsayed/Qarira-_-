<style>
/* Layout: mobile-first app shell. Bottom tab bar on phones, side rail on desktop. Single warm light theme by design. */
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --blue:#A0C9F5; --blue-soft:#E4EFFC; --pink:#F7AFC4; --pink-soft:#FDE9F0;
  --peach:#FADBC4; --brown:#6D524D; --ink:#3B2C29; --muted:#6D524D; --medblue:#568BCB; --link:#2C66AA; --btn-ink:#16304F;
  --line:#EADFD6; --ok:#1F7A4D; --ok-bg:#E3F4EA; --warn:#8A5A00; --warn-bg:#FFF1D6; --err:#B3261E; --err-bg:#FDE7E5;
  --r-s:8px; --r-m:16px; --r-l:24px; --sh:0 1px 2px rgba(109,82,77,.08),0 6px 20px rgba(109,82,77,.08);
  --f-en:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-ar:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-en);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
[dir=rtl],[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:var(--f-ar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--medblue);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flip{display:inline-flex}[dir=rtl] .flip{transform:scaleX(-1)}
.fade{animation:fade .28s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* shell */
.shell{min-height:100vh}
.main{max-width:720px;margin:0 auto;padding-block:8px 120px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;min-height:60px}
.hdr .grow{flex:1;min-width:0}
.hdr h1{font-size:1.25rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--sh);color:var(--brown)}
.iconbtn:hover{background:var(--blue-soft)}.iconbtn:active{transform:scale(.95)}
.iconbtn.flat{background:transparent;box-shadow:none}
.badge-n{position:absolute;top:-2px;inset-inline-end:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#5A1D31;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.langbtn{height:44px;padding:0 14px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);font-weight:700;color:var(--brown)}
.demo-pill{display:inline-flex;align-items:center;gap:6px;background:var(--peach);color:#5B3A1E;border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:800;letter-spacing:.02em}

/* nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav .brand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:.74rem;font-weight:700;min-height:56px;position:relative}
.nav button[aria-current=page]{color:var(--btn-ink);background:var(--blue-soft)}
.nav button:hover{background:var(--blue-soft)}
.nav .badge-n{inset-inline-end:calc(50% - 22px);top:2px}
.demofab{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:44;background:var(--brown);color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:.85rem;display:flex;gap:8px;align-items:center;box-shadow:var(--sh)}
@media(min-width:900px){
  body{padding-left:0;padding-right:0}
  .shell{display:flex}

  [dir=rtl] .nav{inset:0 0 0 auto}
  .nav .brand{display:flex;padding:4px 8px 20px}
  .nav button{flex:0 0 auto;flex-direction:row;gap:12px;font-size:1rem;padding:12px 14px;min-height:48px}
  .nav .badge-n{inset-inline-end:12px;top:12px}
  .main{margin-inline-start:260px;margin-inline-end:auto;width:min(720px,calc(100% - 300px));padding-block:8px 60px}
  .demofab{bottom:24px}
}

/* ui */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);padding:16px}
.card.tap{width:100%;display:block;transition:transform .15s,box-shadow .15s}
.card.tap:hover{box-shadow:0 2px 4px rgba(109,82,77,.1),0 10px 26px rgba(109,82,77,.14)}.card.tap:active{transform:scale(.985)}
.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;align-items:center;gap:12px}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grow{flex:1;min-width:0}
.h2{font-size:1.1rem;font-weight:800}.sub{color:var(--muted);font-size:.9rem}.small{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:24px;font-weight:800;background:var(--blue);color:var(--btn-ink);transition:background .15s,transform .1s;text-align:center}
.btn:hover{background:#8FBDEE}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--surface);box-shadow:inset 0 0 0 2px var(--blue);color:var(--btn-ink)}
.btn.pink{background:var(--pink);color:#4A1426}.btn.danger{background:var(--err);color:#fff}.btn.block{width:100%}.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--link);padding:0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;background:var(--blue-soft);color:var(--btn-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.err{background:var(--err-bg);color:var(--err)}.chip.pink{background:var(--pink-soft);color:#7A2A45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;white-space:nowrap;min-height:40px}
.tab[aria-selected=true],.tab[aria-pressed=true]{background:var(--blue);box-shadow:none;color:var(--btn-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.inp{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.inp:hover{border-color:var(--blue)}.inp:focus{border-color:var(--medblue);outline:none;box-shadow:0 0 0 3px rgba(86,139,203,.3)}
.inp.bad{border-color:var(--err)}.inp[disabled]{background:#F1ECE6}
.errmsg{color:var(--err);font-size:.85rem;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:.9rem;font-weight:600}
.alert.err{background:var(--err-bg);color:var(--err)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.info{background:var(--blue-soft);color:var(--btn-ink)}
.ico{flex:none}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--blue-soft);color:var(--link)}
.tile.pink{background:var(--pink-soft);color:#9A3A5C}.tile.peach{background:var(--peach);color:#6B4220}
.skel{background:linear-gradient(90deg,#EFE8E0 25%,#F8F3EC 37%,#EFE8E0 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pink);flex:none;margin-top:7px}
.empty{text-align:center;padding:32px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.tl{position:relative;padding-inline-start:28px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:9px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:18px}.tl .ev::before{content:"";position:absolute;inset-inline-start:-26px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.tl .ev.done::before{background:var(--medblue);border-color:var(--medblue)}.tl .ev.next::before{border-color:var(--pink);background:var(--pink)}
.strike{text-decoration:line-through;opacity:.7}

/* sheet / toast */
.back{position:fixed;inset:0;z-index:70;background:rgba(59,44,41,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeb .2s both}
@keyframes fadeb{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.back{align-items:center}.sheet{border-radius:28px}}
.toasts{position:fixed;inset-inline:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;box-shadow:var(--sh);max-width:420px;animation:fade .25s both}
.offline{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:39}

/* onboarding / login */
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;text-align:center}
.splash-bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;background:var(--blue);border-radius:3px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
[dir=rtl] .splash-bar i{animation-direction:reverse}
.ob{min-height:100vh;display:flex;flex-direction:column;padding-block:16px 24px;max-width:520px;margin:0 auto}
.ob .art{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:10px;height:10px;border-radius:5px;background:var(--line);transition:all .25s}.dots i.on{width:28px;background:var(--medblue)}
.login{max-width:480px;margin:0 auto;padding-block:24px 48px}

/* camera */
.cam{position:relative;border-radius:var(--r-l);overflow:hidden;background:#1B1412;aspect-ratio:16/10;max-height:70vh;width:100%;box-shadow:var(--sh)}
.cam.fs{position:fixed;inset:0;z-index:80;border-radius:0;aspect-ratio:auto;max-height:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam .feed{position:absolute;inset:0;transition:transform .3s,filter .3s;transform-origin:center}
.cam .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none;color:#fff}
.cam .ov>*{pointer-events:auto}
.livepill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:800;color:#fff}
.livepill b{width:8px;height:8px;border-radius:50%;background:#FF5C7A;animation:pulse 1.4s infinite}.livepill.off b{background:#999;animation:none}
@keyframes pulse{50%{opacity:.25}}
.cam .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:#241B19;color:#fff}
.camctl{display:flex;gap:8px;flex-wrap:wrap}
.camctl .iconbtn{background:rgba(0,0,0,.55);color:#fff;box-shadow:none}
.breath{transform-origin:160px 150px;animation:breath 3.4s ease-in-out infinite}@keyframes breath{50%{transform:scaleY(1.035)}}
.sway{animation:sway 6s ease-in-out infinite;transform-origin:160px 60px}@keyframes sway{50%{transform:rotate(1.2deg)}}
.demotag{background:rgba(250,219,196,.95);color:#4A2D14;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:6px}

/* charts */
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums;font-family:inherit}
.chart .pt{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--medblue);min-height:32px}
.val{font-size:2rem;font-weight:800;line-height:1.1}
.chat{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.bub{max-width:82%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}

.meta{font-size:.72rem;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;gap:8px;z-index:30}
@media(min-width:900px){.composer{bottom:0}}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--brown);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.switch{position:relative;width:52px;height:30px;border-radius:15px;background:#D8CCC2;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--medblue)}.switch[aria-checked=true]::after{transform:translateX(22px)}[dir=rtl] .switch[aria-checked=true]::after{transform:translateX(-22px)}
.linkrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;min-height:56px}.linkrow:last-child{border-bottom:0}
.hide-d{display:inline-flex}

/* ---------- chart ---------- */
function Chart({pts,sel,onSel,dec,unit,label,fmtX,color}){
  const W=340,H=190,L=46,R=14,T=14,Bt=28,n=pts.length;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<0.0001){lo-=1;hi+=1;}const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const X=i=>n===1?L+(W-L-R)/2:L+(W-L-R)*i/(n-1), Y=v=>T+(H-T-Bt)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=line+" L"+X(n-1).toFixed(1)+" "+(H-Bt)+" L"+X(0).toFixed(1)+" "+(H-Bt)+" Z";
  const ticks=[0,1,2,3].map(k=>lo+(hi-lo)*k/3);
  const xi=n>2?[0,Math.floor((n-1)/2),n-1]:[...Array(n).keys()];
  const c=color||"#568BCB";
  return html`<svg className="chart" viewBox=${"0 0 "+W+" "+H} role="img" aria-label=${label}>
   <defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor=${c} stopOpacity=".28"/><stop offset="1" stopColor=${c} stopOpacity="0"/></linearGradient></defs>
   ${ticks.map((t,k)=>html`<g key=${k}><line x1=${L} x2=${W-R} y1=${Y(t)} y2=${Y(t)} stroke="#EADFD6" strokeWidth="1"/><text x=${L-6} y=${Y(t)+3} textAnchor="end">${fmtY(t,dec)}</text></g>`)}
   <path d=${area} fill="url(#ag)"/><path d=${line} fill="none" stroke=${c} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
   ${sel!=null&&html`<line x1=${X(sel)} x2=${X(sel)} y1=${T} y2=${H-Bt} stroke="#F7AFC4" strokeWidth="2" strokeDasharray="4 3"/>`}
   ${pts.map((p,i)=>html`<g key=${i} className="pt" tabIndex="0" role="button" aria-label=${p.aria} onClick=${()=>onSel(i)} onKeyDown=${e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSel(i);}}}>
     <circle cx=${X(i)} cy=${Y(p.y)} r=${n>16?7:13} fill="transparent"/>
     <circle cx=${X(i)} cy=${Y(p.y)} r=${i===sel?6:n>16?2.5:4} fill=${i===sel?"#F7AFC4":"#FFFFFF"} stroke=${i===sel?"#6D524D":c} strokeWidth="2"/></g>`)}
   ${xi.map((i,k)=>html`<text key=${k} x=${X(i)} y=${H-8} textAnchor=${k===0&&n>2?"start":k===xi.length-1&&n>2?"end":"middle"}>${fmtX(pts[i])}</text>`)}
  </svg>`;}
let _fmtLang="en";
function fmtY(v,dec){return new Intl.NumberFormat(loc(_fmtLang),{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v);}

    <button className="tab" aria-pressed=${f==="all"} onClick=${()=>setF("all")}>${t("n_all")}</button>${CATS.map(c=>html`<button key=${c} className="tab" aria-pressed=${f===c} onClick=${()=>setF(c)}>${t("c_"+c)}</button>`)}</div>
   <div className="row wrap"><button className="tab" aria-pressed=${un} onClick=${()=>setUn(!un)}>${t("n_unread")} (${cnt})</button><span className="grow"></span>
    <button className="btn sm sec" disabled=${!cnt} onClick=${()=>up(s=>({...s,notifs:s.notifs.map(n=>({...n,read:true}))}))}><${Icon} n="check" s=${18}/>${t("markAll")}</button>
    <button className="iconbtn" onClick=${()=>setPf(true)} aria-label=${t("prefs")}><${Icon} n="sliders"/></button></div>
   <div className="card">${list.length?html`<div className="list">${list.map(n=>html`<${NotifRow} key=${n.id} n=${n} onOpen=${x=>setDet(x.id)}/>`)}</div>`:html`<${Empty} icon="bell" text=${t("caught")}/>`}</div>
   <${Sheet} open=${!!cur} onClose=${()=>setDet(null)} title=${cur?L(cur.t):""}>${cur&&html`<div className="stack"><span className="chip" style=${{alignSelf:"flex-start"}}>${t("c_"+cur.cat)}</span><p>${L(cur.b)}</p><p className="small">${rel(cur.ts)}</p>
     <button className="btn block" onClick=${()=>{const to=cur.to;setDet(null);go(to);}}>${t("goTo",{s:t(ROUTE_LABEL[cur.to]||"nHome")})}</button>
     <button className="btn sec block" onClick=${()=>{up(s=>({...s,notifs:s.notifs.map(n=>n.id===cur.id?{...n,read:!n.read}:n)}));}}>${t("markRead")}</button></div>`}<//>
   <${Sheet} open=${pf} onClose=${()=>setPf(false)} title=${t("prefs")}><${PrefList}/><//></div>`;}
function PrefList(){const {st,up,t}=useContext(Ctx);
  return html`<div className="list">${CATS.map(c=>html`<div className="li" key=${c} style=${{alignItems:"center"}}><div className="tile" style=${{width:38,height:38,borderRadius:12}}><${Icon} n=${catIcon(c)} s=${18}/></div><div className="grow" style=${{fontWeight:700}}>${t("c_"+c)}</div>
    <${Toggle} on=${st.prefs[c]!==false} label=${t("c_"+c)} onChange=${v=>up(s=>({...s,prefs:{...s.prefs,[c]:v}}))}/></div>`)}</div>`;}

/* ---------- visits ---------- */
function Visits(){const {st,t,fd,ft,L,go}=useContext(Ctx);const v=visitInfo(st);
  const stMap={upcoming:["v_upcoming",""],completed:["v_completed","ok"],resched:["v_resched","warn"],none:["v_none",""]};

   ${v.when?html`<div className="card"><div className="row"><div className="tile"><${Icon} n="cal"/></div><div className="grow"><div className="small">${t("nextVisit")}</div><div className="h2">${fd(v.when,{weekday:"long",day:"numeric",month:"long"})}</div></div><span className=${"chip "+stMap[v.status][1]}>${t(stMap[v.status][0])}</span></div>
     <div className="list" style=${{marginTop:8}}>
      ${v.old&&html`<div className="li"><div className="grow small">${t("vOld")}</div><b className="num strike">${fd(v.old,{day:"numeric",month:"short"})} · ${ft(v.old)}</b></div>`}
      <div className="li"><div className="grow small">${v.old?t("vNew"):t("vTime")}</div><b className="num">${v.status==="completed"?ft(v.when):fd(v.when,{day:"numeric",month:"short"})+" · "+ft(v.when)}</b></div>
      <div className="li"><div className="grow small">${t("hospital")}</div><b>${L(NAME.hosp)}</b></div><div className="li"><div className="grow small">${t("vDept")}</div><b>${t("dept")}</b></div></div></div>
     <div className="card"><h3 className="h2">${t("vInst")}</h3><p style=${{marginTop:6}}>${t("inst")}</p></div>`
    :html`<div className="card"><${Empty} icon="cal" text=${t("noVisitD")}/></div>`}
   <div className="card"><h3 className="h2" style=${{marginBottom:12}}>${t("vTl")}</h3><div className="tl">
     ${v.next&&html`<div className="ev next"><div style=${{fontWeight:700}}>${fd(v.next,{weekday:"short",day:"numeric",month:"short"})} · ${ft(v.next)}</div><span className=${"chip "+stMap[v.status][1]}>${t(stMap[v.status][0])}</span></div>`}
     ${v.past.map((p,i)=>html`<div className="ev done" key=${i}><div style=${{fontWeight:700}}>${fd(p.ts,{weekday:"short",day:"numeric",month:"short"})} · ${ft(p.ts)}</div><span className="chip ok"><${Icon} n="check" s=${14}/>${t("v_completed")}</span></div>`)}</div></div></div>`;}

/* ---------- profile / settings ---------- */
function Profile(){const {t,go,L,lang,up,st,toast}=useContext(Ctx);const [lo,setLo]=useState(false);
  const rows=[["mom","user"],["bb","baby"],["hosp","hosp"],["prefs","bell"],["sec","shield"],["priv","eye"],["help","help"],["about","info"]];
  return html`<div className="stack"><div className="card row"><div className="tile pink" style=${{width:56,height:56,borderRadius:20}}><${Icon} n="user" s=${28}/></div><div className="grow"><div className="h2">${L(NAME.mom)}</div><div className="sub">${L(NAME.hosp)}</div></div></div>
   <div className="card"><div className="small" style=${{marginBottom:8}}>${t("lang")}</div><div className="tabs" role="group" aria-label=${t("lang")}>
     <button className="tab" aria-pressed=${lang==="en"} onClick=${()=>up({lang:"en"})}>English</button><button className="tab" aria-pressed=${lang==="ar"} onClick=${()=>up({lang:"ar"})}>العربية</button></div></div>
   <div className="card" style=${{paddingBlock:4}}>${rows.map(([k,i])=>html`<button key=${k} className="linkrow" onClick=${()=>go("sub:"+k)}><div className="tile" style=${{width:38,height:38,borderRadius:12}}><${Icon} n=${i} s=${18}/></div><span className="grow" style=${{fontWeight:700}}>${t(k)}</span><span className="flip"><${Icon} n="chev" s=${18}/></span></button>`)}
    <button className="linkrow" onClick=${()=>go("visits")}><div className="tile" style=${{width:38,height:38,borderRadius:12}}><${Icon} n="cal" s=${18}/></div><span className="grow" style=${{fontWeight:700}}>${t("nVisit")}</span><span className="flip"><${Icon} n="chev" s=${18}/></span></button></div>
   <button className="btn danger block" onClick=${()=>setLo(true)}><${Icon} n="logout" s=${20}/>${t("logout")}</button>
   <${Sheet} open=${lo} onClose=${()=>setLo(false)} title=${t("logoutQ")}><div className="stack"><p>${t("logoutD")}</p><div className="row"><button className="btn sec grow" onClick=${()=>setLo(false)}>${t("cancel")}</button>
     <button className="btn danger grow" onClick=${()=>{setLo(false);up({authed:false,expired:false});go("login");}}>${t("logout")}</button></div></div><//></div>`;}
function SubPage(){const {route,t,L,lang,up,fd,st}=useContext(Ctx);const k=route.p;
  const KV=(a,b)=>html`<div className="li"><div className="grow small">${a}</div><b>${b}</b></div>`;
  let body;
  if(k==="mom")body=html`<div className="list">${KV(t("name"),L(NAME.mom))}${KV(t("hospital"),L(NAME.hosp))}</div>`;
  else if(k==="bb")body=html`<div className="list">${KV(t("name"),L(NAME.baby))}${KV(t("dob"),fd(new Date("2026-09-24T00:00:00"),{day:"numeric",month:"long",year:"numeric"}))}${KV(t("unit"),t("nicu"))}${KV(t("room"),t("bedNo"))}</div>`;
  else if(k==="hosp")body=html`<div className="list">${KV(t("hospital"),L(NAME.hosp))}${KV(t("unit"),t("nicu"))}${KV(t("vDept"),t("dept"))}</div>`;
  else if(k==="prefs")body=html`<${PrefList}/>`;
  else if(k==="sec")body=html`<div className="alert info"><${Icon} n="shield" s=${20}/>${t("secD")}</div>`;
  else if(k==="priv")body=html`<div className="alert info"><${Icon} n="eye" s=${20}/>${t("privD")}</div>`;
  else if(k==="help")body=html`<div className="alert warn"><${Icon} n="help" s=${20}/>${t("helpD")}</div>`;
  else body=html`<div className="stack"><${Logo} size=${64} lang=${lang}/><p>${t("aboutD")}</p><span className="chip">${t("ver")}</span></div>`;
  return html`<div className="card stack"><h2 className="h2">${t(k)}</h2>${body}</div>`;}

/* ---------- demo panel ---------- */
function Btn({l,f,i}){return html`<button className="btn sec sm" onClick=${f}><${Icon} n=${i} s=${16}/>${l}</button>`;}
function DemoPanel({open,onClose}){const {t,st,up,toast,push,go,setChatTyping}=useContext(Ctx);const [rs,setRs]=useState(false);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const A={
   health:()=>{const v=pick([36.7,36.8,36.9,37.0]),s=pick([95,96,97,98]),now=Date.now();up(x=>({...x,temps:[...x.temps.slice(-11),{ts:now,v}],sats:[...x.sats.slice(-11),{ts:now,v:s}],lastUp:now}));
     push({cat:"health",t:B("New health update","تحديث صحي جديد"),b:B("New temperature and oxygen readings were recorded.","اتسجّلت قراءات جديدة للحرارة والأكسجين."),to:"health:temp"});toast(t("dHealth"));},
   nurse:()=>{up(x=>({...x,mid:x.mid+1,msgs:[...x.msgs,{id:x.mid,from:"nurse",sim:true,seen:false,ts:Date.now(),text:B("Hello! Layla is resting comfortably. (simulated message)","أهلًا! ليلى مرتاحة وبتستريح. (رسالة تجريبية)")}]}));
     push({cat:"nurse",t:B("New message from Nurse Mona","رسالة جديدة من الممرضة منى"),b:B("Hello! Layla is resting comfortably.","أهلًا! ليلى مرتاحة وبتستريح."),to:"messages"});toast(t("dNurse"));},
   feed:()=>{const ml=pick([24,26,28,30]),now=Date.now();up(x=>({...x,feeds:[...x.feeds.slice(-9),{ts:now,type:pick(["ebm","formula"]),ml,note:B("Feed completed.","الرضعة خلصت.")}],lastUp:now}));
     push({cat:"feeding",t:B("Feeding recorded","اتسجّلت رضعة"),b:B("A new feed of "+ml+" ml was recorded.","اتسجّلت رضعة جديدة "+ml+" مل."),to:"health:feeding"});toast(t("dFeed"));},
   lost:()=>{up({cam:"lost",camTries:0});push({cat:"camera",t:B("Camera interrupted","الكاميرا اتقطعت"),b:B("The camera lost connection. Open the camera to retry.","الكاميرا فقدت الاتصال. افتحي الكاميرا وحاولي تاني."),to:"camera"});toast(t("dCamLost"));},
   back:()=>{up({cam:"live",camTries:0});toast(t("dCamBack"));},
   notif:()=>{const p=pick([{cat:"announce",t:B("Hospital announcement","إعلان من المستشفى"),b:B("Parking is free for NICU families this week.","الانتظار مجاني لأسر العناية المركزة الأسبوع ده."),to:"home"},{cat:"visit",t:B("Visit reminder","تذكير بالزيارة"),b:B("Don't forget your visit. See the instructions.","متنسيش زيارتك. شوفي التعليمات."),to:"visits"}]);push(p);toast(t("dNotif"));},
   avail:()=>{up(x=>({...x,nurseAvail:!x.nurseAvail}));},
   expire:()=>{onClose();up({authed:false,expired:true});go("login");},
   off:()=>{up({offline:true});onClose();},
   visit:v=>{up({visit:v});const m={upcoming:["Visit scheduled","اتحددت زيارة","Your next visit is scheduled for tomorrow at 4:00 PM.","زيارتك الجاية بكرة الساعة ٤:٠٠ العصر."],completed:["Visit completed","الزيارة تمت","Today's visit is marked as completed.","زيارة النهارده اتسجّلت كمكتملة."],resched:["Visit rescheduled","الزيارة اتأجلت","Your visit moved by one day. See the new time.","زيارتك اتأجلت يوم. شوفي الموعد الجديد."],none:["No visit scheduled","مفيش زيارة محددة","There is no visit scheduled right now.","مفيش زيارة محددة دلوقتي."]}[v];
     push({cat:"visit",t:B(m[0],m[1]),b:B(m[2],m[3]),to:"visits"});},
   reset:()=>{const s=seed();s.lang=st.lang;try{localStorage.removeItem(LS);}catch(e){}up(()=>s);setRs(false);onClose();setChatTyping(false);go("splash");}};
  const vs=[["upcoming","v_upcoming"],["completed","v_completed"],["resched","v_resched"],["none","v_none"]];
  return html`<${Sheet} open=${open} onClose=${onClose} title=${t("demoCtl")}><div className="stack">
    <div className="alert info"><${Icon} n="info" s=${20}/>${t("demoNote")}</div>
    <div><div className="small" style=${{marginBottom:8}}>${t("dSim")}</div><div className="row wrap">
     <${Btn} i="activity" l=${t("dHealth")} f=${A.health}/><${Btn} i="msg" l=${t("dNurse")} f=${A.nurse}/><${Btn} i="bottle" l=${t("dFeed")} f=${A.feed}/><${Btn} i="bell" l=${t("dNotif")} f=${A.notif}/>
     <${Btn} i="wifi" l=${t("dCamLost")} f=${A.lost}/><${Btn} i="video" l=${t("dCamBack")} f=${A.back}/><${Btn} i="wifi" l=${t("dOff")} f=${A.off}/><${Btn} i="clock" l=${t("dExpire")} f=${A.expire}/></div></div>
    <div className="row"><span className="grow" style=${{fontWeight:700}}>${t("dAvail")}</span><${Toggle} on=${st.nurseAvail} label=${t("dAvail")} onChange=${A.avail}/></div>
    <div><div className="small" style=${{marginBottom:8}}>${t("dVisit")}</div><div className="tabs" role="group">${vs.map(([k,l])=>html`<button key=${k} className="tab" aria-pressed=${st.visit===k} onClick=${()=>A.visit(k)}>${t(l)}</button>`)}</div></div>
    <button className="btn danger block" onClick=${()=>setRs(true)}><${Icon} n="refresh" s=${18}/>${t("dReset")}</button></div>
   <${Sheet} open=${rs} onClose=${()=>setRs(false)} title=${t("dReset")}><div className="stack"><p>${t("dResetD")}</p><div className="row"><button className="btn sec grow" onClick=${()=>setRs(false)}>${t("cancel")}</button><button className="btn danger grow" onClick=${A.reset}>${t("dReset")}</button></div></div><//><//>`;}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

<script>
(function(){try{
var d=document,sentinel=false,silent=false,q=false,tick=false;
window.addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;d.body.classList.toggle('scrolled',(window.scrollY||0)>4)})},{passive:true});
/* material ripple */
d.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('.btn,.card.tap,.tab,.linkrow,.langbtn');if(!el||el.disabled)return;
var r=el.getBoundingClientRect();el.style.setProperty('--rx',(e.clientX-r.left)+'px');el.style.setProperty('--ry',(e.clientY-r.top)+'px');el.style.setProperty('--rs',(Math.max(r.width,r.height)*2)+'px');
el.classList.remove('rp-on');void el.offsetWidth;el.classList.add('rp-on');setTimeout(function(){el.classList.remove('rp-on')},600)},{passive:true});
/* no pinch zoom / long-press menu on touch devices, like a native app */
d.addEventListener('gesturestart',function(e){e.preventDefault()});
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)d.addEventListener('contextmenu',function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
/* Android/browser back button navigates inside the app */
function backBtn(){return d.querySelector('.hdr > button.iconbtn .flip')}
function depth(){if(d.querySelector('.back'))return 1;if(!d.querySelector('.hdr'))return 0;if(backBtn())return 1;var f=d.querySelector('.nav button');return f&&f.getAttribute('aria-current')!=='page'?1:0}
function sync(){q=false;var dp=depth();
if(dp===1&&!sentinel){history.pushState({qarira:1},'');sentinel=true}
else if(dp===0&&sentinel){sentinel=false;silent=true;history.back()}}
new MutationObserver(function(){if(!q){q=true;requestAnimationFrame(function(){try{sync()}catch(e){q=false}})}}).observe(d.getElementById('root'),{childList:true,subtree:true});
window.addEventListener('popstate',function(){if(silent){silent=false;return}if(!sentinel)return;sentinel=false;
if(d.querySelector('.back')){d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return}
var b=backBtn();if(b){b.closest('button').click();return}
var f=d.querySelector('.nav button');if(f&&f.getAttribute('aria-current')!=='page')f.click()});
}catch(e){}})();
</script>
