<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F3"><title>Little Hearts – NICU Parent App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F3;--blue:#A0C9F5;--pink:#F7AFC4;--peach:#FADBC4;--brown:#6D524D;--mblue:#568BCB;--card:#fff;--line:rgba(109,82,77,.12);--ok:#5E9E78;color-scheme:light}
*{box-sizing:border-box;margin:0;font-family:"Nunito","Quicksand","Segoe UI",system-ui,sans-serif}
html,body{min-height:100%;background:var(--bg);color:var(--brown);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
#app{min-height:100dvh;padding-top:env(safe-area-inset-top,0px)}
main{padding:20px 18px calc(96px + env(safe-area-inset-bottom,0px))}main.nonav{padding-bottom:24px}
.wrap{max-width:720px;margin:0 auto}.wrap.narrow{max-width:440px;min-height:calc(100dvh - 120px);display:flex;flex-direction:column;justify-content:center}
h1{font-size:26px;font-weight:800}h2{font-size:20px;font-weight:800;margin-bottom:12px}h3{font-size:15px;font-weight:800}
p,.sm{font-size:14px;line-height:1.5}.mut{opacity:.75}.sm{font-size:12.5px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(109,82,77,.08)}
.btn{transition:background .15s,transform .1s;display:block;width:100%;min-height:48px;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:var(--blue);color:var(--brown);cursor:pointer}
.btn:active{transform:scale(.97)}.hcard{transition:transform .15s,box-shadow .15s}.hcard:hover{box-shadow:0 2px 4px rgba(109,82,77,.1),0 10px 26px rgba(109,82,77,.14)}.hcard:active{transform:scale(.985)}
.btn.alt{background:var(--peach)}
.btn:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--mblue);outline-offset:2px}
input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;color:var(--brown);margin:4px 0 12px}
label{font-size:13px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--peach)}
.pill.live{background:#DDEFE3;color:#3F7A58}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-inline-end:5px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--blue);display:grid;place-items:center;overflow:hidden}
.avatar img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:50%}
.ico{width:52px;height:auto;flex:none;border-radius:14px;mix-blend-mode:multiply}
.hcard{border:0;text-align:start;color:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;margin:0;font-weight:800}
.hcard h3{font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--brown);opacity:.65;cursor:pointer;position:relative}
nav button svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{opacity:1;color:var(--mblue)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:3px;background:var(--blue)}
.badge{position:absolute;top:2px;inset-inline-end:22%;background:var(--pink);color:var(--brown);border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
.badge.d{width:10px;height:10px;padding:0;inset-inline-end:30%}
.sidelogo{display:none}
.stack{display:flex;flex-direction:column;gap:14px}.stack>.card,.stack>.grid{margin:0}.grid.h{gap:14px}.hcard{padding:14px 16px}
.vid{position:relative;container-type:inline-size;width:min(100%,calc((100dvh - 190px)*1.6));margin:0 auto;aspect-ratio:8/5;border-radius:22px;overflow:hidden;background:#3a2c45;box-shadow:0 6px 20px rgba(109,82,77,.18)}
.vid .sc{position:absolute;inset:0;transition:transform .35s ease,filter .4s}
.vid .sc svg{width:100%;height:100%;display:block}
.vid.night .sc{filter:brightness(.5) saturate(.7)}
.vid.fs{position:fixed;inset:0;z-index:50;border-radius:0;aspect-ratio:auto;width:100%;max-width:none}
.vid:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;max-width:none}
.demotag .short{display:none}
@container (max-width:460px){.demotag .full{display:none}.demotag .short{display:inline}.demotag{font-size:10px;padding:4px 8px}.pillv{font-size:12px;padding:4px 10px;top:8px;left:8px}.demotag{top:8px;right:8px}.ctl button{width:36px;height:36px}.ctl svg{width:17px;height:17px}.ctl{gap:6px}.clk{font-size:12px;padding:4px 10px}.vbar{padding:8px}}
@container (min-width:900px){.pillv,.clk{font-size:16px;padding:7px 16px}.demotag{font-size:13px}.ctl button{width:50px;height:50px}.ctl svg{width:24px;height:24px}}
.pillv{position:absolute;top:12px;left:12px;background:rgba(30,24,36,.85);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.pillv i{width:8px;height:8px;border-radius:50%;background:#ff6b8b;animation:pulse 1.4s infinite}
.demotag{position:absolute;top:12px;right:12px;background:var(--peach);color:var(--brown);border-radius:10px;padding:5px 10px;font-size:11px;font-weight:800;max-width:55%}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(transparent,rgba(15,10,20,.75))}
.clk{background:rgba(15,10,20,.85);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.ctl{display:flex;gap:8px}
.ctl button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(10,8,12,.9);color:#fff;cursor:pointer;display:grid;place-items:center}
.ctl svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.06)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes ecg{to{transform:translateX(-30px)}}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.2}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(14px,-26px)}}
.mob{transform-origin:403px 0;animation:sway 4s ease-in-out infinite}
.bdy{transform-origin:470px 340px;animation:breathe 3s ease-in-out infinite}
.hd{transform-origin:310px 335px;animation:bob 3.6s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.hand{transform-origin:350px 335px;animation:wave 2.4s ease-in-out infinite}
.ecg{animation:ecg .43s linear infinite}
.heart{transform-box:fill-box;transform-origin:center;animation:beat .43s infinite}
.star{animation:tw 3s infinite}
@media (prefers-reduced-motion:reduce){.mob,.bdy,.hd,.eye,.hand,.ecg,.heart,.star{animation:none}}
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;margin-bottom:8px;font-size:14px;line-height:1.45}
.bubble.n{background:#fff;border-end-start-radius:6px}.bubble.p{background:var(--blue);margin-inline-start:auto;border-end-end-radius:6px}
.note{background:var(--peach);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.notif{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.notif.unread{border-inline-start:4px solid var(--pink)}
.notif img{width:34px;border-radius:10px;mix-blend-mode:multiply}
.sw{width:46px;height:26px;border-radius:99px;background:#ddd;position:relative;border:0;cursor:pointer}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--mblue)}.sw.on::after{inset-inline-start:23px}
.center{text-align:center}.demo{font-size:11px;text-align:center;opacity:.6;margin-top:8px}
.spin{width:26px;height:26px;border:3px solid var(--peach);border-top-color:var(--mblue);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.back{border:0;background:none;color:var(--mblue);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
@media (max-width:359px){.grid.h{grid-template-columns:1fr}h1{font-size:23px}main{padding:16px 14px calc(92px + env(safe-area-inset-bottom,0px))}main.nonav{padding-bottom:20px}nav button{font-size:10px}}
@media (min-width:600px) and (max-width:899px){main{padding:28px 32px calc(100px + env(safe-area-inset-bottom,0px))}main.nonav{padding-bottom:28px}h1{font-size:30px}h2{font-size:23px}p{font-size:15px}.sm{font-size:13.5px}nav button{font-size:12.5px;padding:10px 2px}nav button svg{width:26px;height:26px}.wrap{max-width:680px}}
@media (orientation:landscape) and (max-height:520px) and (max-width:899px){nav{top:0;left:auto;right:auto;inset-inline-start:0;bottom:0;width:78px;flex-direction:column;justify-content:space-around;border-top:0;border-inline-end:1px solid var(--line);padding:4px 0}nav button{font-size:10px;padding:4px 2px}main{margin-inline-start:78px;padding:14px 22px 20px}main.nonav{margin-inline-start:0}.vid{width:min(100%,calc((100dvh - 100px)*1.6))}}
@media (min-width:900px){nav{top:0;left:auto;right:auto;inset-inline-start:0;bottom:0;width:240px;flex-direction:column;border-top:0;border-inline-end:1px solid var(--line);padding:24px 14px;gap:4px;justify-content:flex-start}nav button{flex:0 0 auto;display:flex;align-items:center;gap:12px;font-size:15px;padding:12px 14px;border-radius:14px;text-align:start}nav button svg{margin:0}nav button.on{background:#EAF3FD}nav button.on::before{display:none}.badge,.badge.d{position:static;margin-inline-start:auto}.sidelogo{display:block;width:110px;margin:4px auto 18px;border-radius:22px}main{margin-inline-start:240px;padding:36px 48px 48px}main.nonav{margin-inline-start:0}.wrap{max-width:780px}.wrap.narrow{max-width:460px}h1{font-size:30px}h2{font-size:24px}p{font-size:15px}.sm{font-size:13.5px}}

.tb{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:44px}
.tb .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb .sp{flex:1}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(109,82,77,.12);display:inline-grid;place-items:center;color:var(--brown);cursor:pointer;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .badge{top:-5px;inset-inline-end:-5px;font-size:10px}
.lang{height:42px;padding:0 16px;border-radius:21px;border:0;background:#fff;box-shadow:0 2px 8px rgba(109,82,77,.12);font-weight:800;font-size:14px;color:var(--brown);cursor:pointer;flex:none}
.dm{display:inline-flex;align-items:center;background:var(--peach);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:800;flex:none;white-space:nowrap}
@media (max-width:420px){.dm{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;background:#E4EFFC;color:#16304F}.chip.pink{background:#FDE9F0;color:#7A2A45}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tab{border:0;padding:10px 18px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;color:var(--brown);cursor:pointer;white-space:nowrap}.tab.on{background:var(--blue);box-shadow:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mc{border:0;text-align:start;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;margin:0;transition:transform .15s,box-shadow .15s}
.mc:hover{box-shadow:0 2px 4px rgba(109,82,77,.1),0 10px 26px rgba(109,82,77,.14)}.mc:active{transform:scale(.985)}.mc h3{font-size:19px}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#E4EFFC;color:#2C66AA;margin-bottom:8px;flex:none}
.tile svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.pink{background:#FDE9F0;color:#9A3A5C}.tile.peach{background:var(--peach);color:#6B4220}
.cbox svg{width:100%;height:auto;display:block;margin-top:6px}.cbox text{font-family:inherit;fill:var(--brown);font-size:13px}
input[type=range]{padding:0;border:0;margin:12px 0 8px;accent-color:var(--mblue);height:24px;background:none}
.mback{position:fixed;inset:0;z-index:70;background:rgba(59,44,41,.45);display:flex;align-items:flex-end;justify-content:center;animation:fb .2s both}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sup .25s both}
@media (min-width:700px){.mback{align-items:center}.sheet{border-radius:28px}}
@keyframes fb{from{opacity:0}}@keyframes sup{from{transform:translateY(40px);opacity:0}}
.rrow{display:flex;gap:12px;align-items:center;margin:12px 0}
[dir=rtl] *{font-family:"Cairo","Nunito","Segoe UI",Tahoma,sans-serif}
[dir=rtl] .vid,[dir=rtl] .cbox,[dir=rtl] input[type=range]{direction:ltr}
</style></head><body>
<div id="app"><main id="main"></main><nav id="nav" hidden></nav><div id="modal"></div></div>

</svg>`}
function pad(n){return String(n).padStart(2,'0')}
function nowStr(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',MOON='<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>';
const V={
welcome:()=>`<div class="center" style="padding-top:20px"><img src="${LOGO}" alt="Little Hearts logo" style="width:200px;max-width:55%;height:auto;border-radius:28px;display:block;margin:0 auto"><h1 style="margin:10px 0">Little Hearts</h1><p class="mut">Stay close to your baby, even from far away.</p>
<div style="margin:28px 0"><div class="avatar" style="width:110px;height:110px;margin:0 auto"><img src="${ICO.baby}" alt="" style="width:92px;height:92px"></div></div><p style="margin-bottom:22px">Watch over your little one, follow daily updates and talk to the nursing team — all in one calm place.</p><button class="btn" onclick="go('login')">Get started</button><p class="demo">Prototype with sample data for demonstration only</p></div>`,
login:()=>`<img src="${LOGO}" alt="Little Hearts logo" style="width:84px;border-radius:20px;display:block;margin:10px auto 0"><h2 style="margin-top:12px">Log in securely</h2><p class="mut" style="margin-bottom:16px">Use the details given to you by the hospital.</p>
<label>Hospital name</label><input value="Sample Children's Hospital"><label>Baby access code</label><input value="NICU-2048" inputmode="text"><label>Baby's name</label><input value="Baby Layla"><label>Baby's date of birth</label><input type="date" value="2026-09-20">
<button class="btn" onclick="S.loading=1;render();setTimeout(()=>{S.loading=0;go('home')},900)">Log in securely</button>
<div class="note" style="margin-top:14px">🔒 Access is limited to authorized family members. Your baby's information is private and protected.</div>`,
home:()=>`<div class="row" style="margin-bottom:16px"><div class="avatar" style="background:var(--blue)"><img src="${ICO.baby}" alt=""></div><div class="grow"><p class="sm mut">Good morning, Mama 🌸</p><h1 style="font-size:22px">Baby Layla</h1></div></div>
<div class="stack"><div class="card"><span class="pill live"><span class="dot"></span>Stable and resting</span><p class="sm mut" style="margin:8px 0 12px">Last update: today, 9:40 AM</p><button class="btn" onclick="go('live')">▶ Watch live</button></div>
<div class="card"><h3>Latest health update</h3><p style="margin-top:6px">Layla gained 20 g since yesterday and finished her morning feed calmly.</p><p class="sm mut" style="margin-top:6px">Recorded by Nurse Mona</p></div>
<div class="grid h"><button class="card hcard" onclick="go('records')"><img class="ico" src="${ICO.baby}" alt=""><h3>Little Moments</h3></button><button class="card hcard" onclick="go('chat')"><img class="ico" src="${ICO.bub}" alt=""><h3>Miss you</h3></button></div>
<button class="card hcard" onclick="go('notifs')"><img class="ico" src="${ICO.bell}" alt=""><h3 class="grow">Reminders</h3>${unread()?`<span class="pill" style="background:var(--pink)">${unread()} new</span>`:''}</button>
<div class="card row"><div style="font-size:26px">🕓</div><div><h3>Next visiting time</h3><p class="sm">Today, 4:00 PM</p></div></div>
<p class="center sm mut" style="margin-top:4px">You are doing wonderfully. We are here with her. 💛</p></div>`,
live:()=>`<h2>Live camera</h2>
<div class="vid ${S.night?'night':''}" id="vid"><div class="sc" id="sc" style="transform:scale(${S.zoom})">${scene()}</div>
<span class="pillv"><i></i>Live</span><span class="demotag"><b class="full">DEMO FOOTAGE · fictional, not a real hospital feed</b><b class="short">DEMO FOOTAGE</b></span>
<div class="vbar"><span class="clk" id="clk">${nowStr()}</span><div class="ctl">
<button aria-label="Zoom out" onclick="zoomBy(-.25)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
<button aria-label="Zoom in" onclick="zoomBy(.25)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button id="nbtn" aria-label="Night mode" onclick="toggleNight()"><svg viewBox="0 0 24 24">${S.night?SUN:MOON}</svg></button>
<button aria-label="Full screen" onclick="fullscreen()"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div></div>
<p class="center" style="margin:12px 0 4px;font-weight:700">Your baby is sleeping 😴</p>
<p class="center sm mut">🔒 Private stream, only you can see it · Sample view</p>`,
records:()=>{const L=DATA[N-1],mc=(mt,l,v,s,a)=>`<button class="card mc" onclick="${a}"><span class="tile ${mt.tile}">${svg(mt.ic)}</span><span class="sm mut">${l}</span><h3>${v}</h3><span class="sm mut">${s}</span></button>`;
return `<div class="row" style="margin-bottom:12px"><img class="ico" src="${ICO.baby}" alt="" style="width:46px"><h2 style="margin:0">Little Moments</h2></div>
<div class="chips"><span class="chip">Updated today</span><span class="chip pink">Demo data, fictional</span></div>
<div class="mgrid">${mc(MET.weight,'Weight',`${fv('w',L.w)} ${T('g')}`,'Measured today',"openMetric('weight')")}${mc(MET.temp,'Temperature',`${L.t.toFixed(1)} ${T('°C')}`,'Measured 9:30 AM',"openMetric('temp')")}${mc(MET.oxy,'Oxygen saturation',`${L.o}%`,'Measured 8:00 AM',"openMetric('oxy')")}${mc(MET.feed,'Feeding',`45 ${T('ml')}`,'Formula · 9:00 AM',"openMetric('feed')")}${mc(MED,'Medication','Vitamin D drops','Given 8:30 AM',"S.modal='meds';render()")}${mc(DOC,'Doctor notes','Dr. Karim (demo)','Today, 8:15 AM',"S.modal='notes';render()")}</div>`},
detail:()=>`<div class="chips"><span class="chip">Updated today</span><span class="chip pink">Demo data, fictional</span></div>
<div class="tabs">${[7,14,30].map(n=>`<button class="tab ${S.range===n?'on':''}" onclick="setRange(${n})">${n} days</button>`).join('')}</div>
<div class="card"><div class="cbox" id="cbox"></div><input type="range" id="sl" dir="ltr" min="0" max="${S.range-1}" value="${S.sel}" aria-label="Day" oninput="pick(+this.value)"><p class="sm mut">Tap a point or drag the slider to pick a day.</p></div>
<button class="btn" onclick="S.modal='report';render()">Daily report</button>`,
chat:()=>`<div class="row" style="margin-bottom:12px"><img class="ico" src="${ICO.bub}" alt="" style="width:46px"><h2 style="margin:0">Miss you</h2></div>
<div class="card row"><div class="avatar" style="width:44px;height:44px;font-size:20px">👩🏻‍⚕️</div><div><h3>Nurse Mona</h3><p class="sm"><span class="dot"></span>Available · 8 AM – 8 PM · replies within 30 min</p></div></div>
<div id="msgs">${S.msgs.map(m=>`<div class="bubble ${m.w}">${m.t}</div>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="mi" placeholder="Write a message" style="margin:0" onkeydown="if(event.key==='Enter')send()"><button class="btn" style="width:auto;padding:13px 18px" onclick="send()">Send</button></div>
<div class="note" style="margin-top:12px">⚠️ This chat is not an emergency service. For urgent concerns, contact hospital staff directly.</div>`,
notifs:()=>{const gs=['Today','Yesterday'];
return `<div class="center"><img src="${ICO.bell5}" alt="" style="width:${S.notifs.length?90:150}px;height:auto;border-radius:20px;mix-blend-mode:multiply"></div>
<div class="row" style="margin:8px 0 12px"><h2 class="grow" style="margin:0">Reminders</h2>${unread()?`<button class="back" style="margin:0" onclick="S.notifs.forEach(n=>n.u=0);render()">Mark all read</button>`:''}</div>
${S.notifs.length?gs.map(g=>`<p class="sm mut" style="margin:8px 0">${g}</p>`+S.notifs.filter(n=>n.g===g).map(n=>`<div class="card notif ${n.u?'unread':''}" onclick="S.notifs.find(x=>x.id==${n.id}).u=0;render()"><img src="${ICO.bell}" alt=""><div><h3>${n.t}</h3><p class="sm">${n.d}</p><p class="sm mut" style="font-size:11px">${n.time}</p></div></div>`).join('')).join(''):'<p class="center mut" style="margin-bottom:12px">No reminders yet.</p>'}
${S.notifs.length?'<button class="btn alt" onclick="S.notifs=[];render()">Clear all</button>':''}`},
settings:()=>`<button class="back" onclick="go('home')">← Back</button><h2>Profile & settings</h2>
<div class="card"><h3>Baby Layla</h3><p class="sm">Born 20 Sep 2026 · Sample Children's Hospital · Access code NICU-2048</p><p class="sm mut" style="margin-top:6px">Authorized: Mother, Father</p></div>
<div class="card">${[['n','Push notifications'],['p','Private mode (hide previews)'],['b','Biometric lock']].map(([k,l])=>`<div class="row" style="padding:8px 0"><p class="grow">${l}</p><button class="sw ${S.set[k]?'on':''}" aria-label="${l}" onclick="S.set['${k}']^=1;render()"></button></div>`).join('')}</div>
<div class="card"><h3>Help and support</h3><p class="sm" style="margin-top:4px">Contact the NICU front desk: ext. 204 (sample)</p></div>
<button class="btn alt" onclick="go('welcome')">Log out securely</button>`};
function zoomBy(d){S.zoom=Math.min(2,Math.max(1,+(S.zoom+d).toFixed(2)));const e=$('#sc');if(e)e.style.transform=`scale(${S.zoom})`}
function toggleNight(){S.night=!S.night;const v=$('#vid');if(v)v.classList.toggle('night',S.night);const b=$('#nbtn');if(b)b.innerHTML=`<svg viewBox="0 0 24 24">${S.night?SUN:MOON}</svg>`}
function fullscreen(){const v=$('#vid');if(!v)return;if(document.fullscreenElement){document.exitFullscreen();return}
if(v.classList.contains('fs')){v.classList.remove('fs');return}
if(v.requestFullscreen){v.requestFullscreen().catch(()=>v.classList.add('fs'))}else v.classList.add('fs')}
function send(){const i=$('#mi');if(!i||!i.value.trim())return;S.msgs.push({w:'p',t:i.value.trim().replace(/</g,'&lt;')});render();$('#mi').focus();setTimeout(()=>{S.msgs.push({w:'n',t:'Thank you, I will reply soon. 💛'});if(S.screen==='chat')render()},900)}
function startLive(){let k=0;S.timer=setInterval(()=>{const c=$('#clk');if(!c){clearInterval(S.timer);S.timer=null;return}c.textContent=nowStr();if(++k%3===0){const b=$('#bpm');if(b)b.textContent=138+Math.floor(Math.random()*9)}},1000)}
function render(){if(S.timer){clearInterval(S.timer);S.timer=null}
const narrow=['welcome','login'].includes(S.screen);
const body=S.loading?'<div class="spin"></div><p class="center sm">Connecting securely…</p>':V[S.screen]();
$('#main').innerHTML=narrow?`<div class="wrap" style="min-height:0">${tb()}</div><div class="wrap narrow">${body}</div>`:`<div class="wrap">${tb()}${body}</div>`;
nav();$('#modal').innerHTML=modal();applyDir();if(S.screen==='detail')drawChart();tl($('#app'));
if(S.screen==='live')startLive()}
render();
</script></body></html>
